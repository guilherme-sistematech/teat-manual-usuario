<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 390" role="img" aria-labelledby="title desc">
  <title id="title">Fluxo para guardar e retomar um caso</title><desc id="desc">Interrupção do preenchimento, armazenamento como rascunho, retomada, recaptura de dados e finalização.</desc>
  <defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0 10 3 0 6Z" fill="#2f6f9f"/></marker><style>.b{fill:#f4f8fc;stroke:#2f6f9f;stroke-width:3}.c{fill:#fff4cc;stroke:#d49b00;stroke-width:3}.d{fill:#eaf5ec;stroke:#2f7d4a;stroke-width:3}.l{stroke:#2f6f9f;stroke-width:3;fill:none;marker-end:url(#a)}.t{font:600 20px Calibri,Arial,sans-serif;fill:#0b2e4f;text-anchor:middle}.s{font:16px Calibri,Arial,sans-serif;fill:#34495e;text-anchor:middle}.n{font:17px Calibri,Arial,sans-serif;fill:#536273;text-anchor:middle}</style></defs>
  <rect width="1200" height="390" rx="20" fill="#fff"/><path d="M20 1h1160a19 19 0 0 1 19 19v2H1v-2A19 19 0 0 1 20 1Z" fill="#0b2e4f"/><path d="M1 22h900v6H1Z" fill="#d49b00"/><path d="M901 22h298v6H901Z" fill="#2f7d4a"/>
  <rect class="b" x="25" y="120" width="175" height="100" rx="14"/><text class="t" x="112" y="158">Caso em</text><text class="t" x="112" y="183">andamento</text><path class="l" d="M200 170H225"/>
  <rect class="c" x="225" y="120" width="175" height="100" rx="14"/><text class="t" x="312" y="158">Guardar</text><text class="s" x="312" y="185">confirmar interrupção</text><path class="l" d="M400 170H425"/>
  <rect class="b" x="425" y="120" width="175" height="100" rx="14"/><text class="t" x="512" y="158">Rascunho</text><text class="s" x="512" y="185">sem número ou hash</text><path class="l" d="M600 170H625"/>
  <rect class="b" x="625" y="120" width="175" height="100" rx="14"/><text class="t" x="712" y="158">Retomar</text><text class="s" x="712" y="185">identificar e revisar</text><path class="l" d="M800 170H825"/>
  <rect class="c" x="825" y="120" width="150" height="100" rx="14"/><text class="t" x="900" y="158">Recapturar</text><text class="s" x="900" y="185">dados não preservados</text><path class="l" d="M975 170H1000"/>
  <rect class="d" x="1000" y="120" width="175" height="100" rx="14"/><text class="t" x="1087" y="158">Finalizar</text><text class="s" x="1087" y="185">número + hash + fila</text>
  <path class="l" d="M900 220V280H712V222"/><text class="n" x="806" y="310">Se faltarem fotos, assinatura ou GPS, volte à etapa correspondente.</text>
  <text class="n" x="600" y="350">Guardar não produz um ato jurídico finalizado.</text>
</svg>
