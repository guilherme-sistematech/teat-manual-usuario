name: Publicar manual no GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Validar conteúdo e release
        run: npm run check

      - name: Testar geração do PDF
        run: npm run pdf -- --output /tmp/manual-usuario-teat.pdf

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Gerar site com Jekyll
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./manual-usuario
          destination: ./_site

      - name: Enviar artefato do Pages
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./_site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Publicar no GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
